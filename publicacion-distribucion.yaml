openapi: 3.1.0

info:
  title: Publicación y distribución de contenido
  version: 1.0.0
  description: |
    Gestiona el **ciclo de vida técnico del video** en la plataforma: subida de archivos,
    procesamiento y transcodificación, reproducción adaptativa y transmisión en vivo.

    Este contexto conoce el video exclusivamente como **archivo o stream** — no como
    producto editorial. No decide si el contenido es visible al público, ni gestiona
    metadata visible como título, descripción o tags. Esas responsabilidades pertenecen
    al contexto de *Catálogo editorial y derechos*.

    ## Actores
    - **creator** — creador de contenido autenticado
    - **viewer** — espectador autenticado o anónimo
    - **system** — servicio interno (otros bounded contexts)

    ## Eventos que emite
    - `content.uploaded` — subida completada exitosamente
    - `processing.completed` — procesamiento finalizado (éxito o fallo)
    - `asset.ready` — asset técnicamente listo para publicación editorial
    - `playback.session.completed` — sesión de reproducción finalizada
    - `livestream.started` — transmisión en vivo iniciada
    - `livestream.ended` — transmisión en vivo finalizada

servers:
  - url: https://api.youtube-clone.com/publication/v1
    description: Servidor de producción

security:
  - BearerAuth: []

tags:
  - name: upload
    description: Gestión de sesiones de subida de video
  - name: assets
    description: Consulta y gestión de assets técnicos
  - name: processing
    description: Estado y control del procesamiento (transcoding)
  - name: playback
    description: Reproducción y sesiones de visualización
  - name: livestream
    description: Configuración y control de transmisiones en vivo

# ──────────────────────────────────────────────────────────────────────────────
# PATHS
# ──────────────────────────────────────────────────────────────────────────────

paths:

  # ── Upload sessions ──────────────────────────────────────────────────────────

  /upload-sessions:
    post:
      summary: Iniciar una sesión de subida
      description: >
        El creador declara el tamaño y formato del archivo que va a subir.
        El sistema reserva la sesión y devuelve el ID necesario para reportar progreso.
      operationId: createUploadSession
      tags: [upload]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadSessionRequest'
      responses:
        '201':
          description: Sesión de subida creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /upload-sessions/{sessionId}:
    get:
      summary: Consultar estado de una subida
      operationId: getUploadSession
      tags: [upload]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Estado actual de la sesión de subida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Actualizar bytes subidos
      description: >
        Reporta el progreso de la subida. Permite que el cliente informe
        cuántos bytes han sido transferidos hasta el momento.
      operationId: updateUploadProgress
      tags: [upload]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUploadProgressRequest'
      responses:
        '200':
          description: Progreso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      summary: Cancelar una subida en curso
      operationId: cancelUploadSession
      tags: [upload]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Subida cancelada exitosamente
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La sesión ya está completada o cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /upload-sessions/{sessionId}/complete:
    post:
      summary: Marcar subida como completada
      description: >
        Valida que los bytes recibidos coincidan con el total declarado.
        Si la validación es exitosa, crea un VideoAsset e inicia automáticamente
        el ProcessingJob. Emite el evento `content.uploaded`.
      operationId: completeUploadSession
      tags: [upload]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '201':
          description: Subida completada; VideoAsset creado y procesamiento iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAsset'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Bytes recibidos no coinciden con el total declarado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Video assets ─────────────────────────────────────────────────────────────

  /video-assets/{assetId}:
    get:
      summary: Consultar detalle técnico de un asset
      description: >
        Retorna el estado técnico del asset: duración, formato original,
        estado de procesamiento. Puede ser consultado por el creador o por
        servicios internos (ej. Catálogo, al vincular metadata editorial).
      operationId: getVideoAsset
      tags: [assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Detalle del asset técnico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Eliminar un asset técnico
      description: >
        Elimina el asset y todas sus renditions asociadas. Solo el creador
        propietario puede ejecutar esta operación.
      operationId: deleteVideoAsset
      tags: [assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Asset eliminado exitosamente
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /video-assets/{assetId}/renditions:
    get:
      summary: Listar calidades disponibles de un asset
      description: >
        Retorna las versiones transcodificadas disponibles para reproducción.
        Cada rendition incluye su URL, calidad, codec y bitrate.
      operationId: listVideoRenditions
      tags: [assets]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Lista de renditions disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoRendition'
                  total:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Processing ───────────────────────────────────────────────────────────────

  /video-assets/{assetId}/processing-job:
    get:
      summary: Consultar estado del procesamiento (transcoding)
      description: >
        Retorna el estado actual del job de procesamiento asociado al asset.
        Útil para que el creador monitoree el progreso tras completar la subida.
      operationId: getProcessingJob
      tags: [processing]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Estado del job de procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingJob'
        '404':
          $ref: '#/components/responses/NotFound'

  /video-assets/{assetId}/processing-job/retry:
    post:
      summary: Reintentar un procesamiento fallido
      description: >
        Solo puede ejecutarse si el job actual tiene status `failed`.
        Crea un nuevo intento de procesamiento. Emite `processing.completed`
        al finalizar el nuevo intento.
      operationId: retryProcessingJob
      tags: [processing]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '202':
          description: Reintento aceptado e iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El procesamiento no está en estado fallido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Playback ─────────────────────────────────────────────────────────────────

  /video-assets/{assetId}/playback-sessions:
    post:
      summary: Iniciar una sesión de reproducción
      description: >
        Registra el inicio de reproducción de un asset. El sistema selecciona
        la rendition más adecuada según dispositivo, región y calidad preferida.
        Retorna la URL de reproducción y los datos de la sesión.
      operationId: createPlaybackSession
      tags: [playback]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybackSessionRequest'
      responses:
        '201':
          description: Sesión de reproducción iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /playback-sessions/{sessionId}:
    patch:
      summary: Actualizar progreso de reproducción
      description: >
        El cliente reporta periódicamente cuántos segundos se han visto,
        la calidad en uso y las interrupciones acumuladas. Permite métricas
        técnicas en tiempo real.
      operationId: updatePlaybackProgress
      tags: [playback]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaybackProgressRequest'
      responses:
        '200':
          description: Progreso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '404':
          $ref: '#/components/responses/NotFound'

  /playback-sessions/{sessionId}/end:
    post:
      summary: Finalizar sesión de reproducción
      description: >
        Cierra la sesión de reproducción y consolida las métricas finales.
        Emite el evento `playback.session.completed`, consumido por Audiencia
        y Descubrimiento para registrar watch time y señales de engagement.
      operationId: endPlaybackSession
      tags: [playback]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Sesión finalizada con métricas consolidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La sesión ya fue finalizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Live streams ─────────────────────────────────────────────────────────────

  /live-streams:
    post:
      summary: Configurar una transmisión en vivo
      description: >
        El creador reserva un stream. El sistema genera un `streamKey`
        e `ingestUrl` para conectar software externo (OBS, Streamlabs, etc.).
        El stream queda en estado `configured` hasta que se invoque `/start`.
      operationId: createLiveStream
      tags: [livestream]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiveStreamRequest'
      responses:
        '201':
          description: Stream configurado con credenciales de ingesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /live-streams/{streamId}:
    get:
      summary: Consultar estado de un live stream
      operationId: getLiveStream
      tags: [livestream]
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200':
          description: Detalle y estado actual del stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStream'
        '404':
          $ref: '#/components/responses/NotFound'

  /live-streams/{streamId}/start:
    post:
      summary: Iniciar transmisión en vivo
      description: >
        Activa el stream. El estado cambia de `configured` a `live`.
        Emite el evento `livestream.started`.
      operationId: startLiveStream
      tags: [livestream]
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200':
          description: Stream en vivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El stream no está en estado configurable para iniciar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /live-streams/{streamId}/end:
    post:
      summary: Finalizar transmisión en vivo
      description: >
        Cierra el stream. El estado cambia a `ended`. Si `generateRecording`
        es true, el sistema genera un VideoAsset con la grabación y lo
        procesa normalmente. Emite el evento `livestream.ended`.
      operationId: endLiveStream
      tags: [livestream]
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndLiveStreamRequest'
      responses:
        '200':
          description: Stream finalizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El stream no está activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ──────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT que identifica al actor. El campo `role` del payload
        determina el nivel de acceso: `creator`, `viewer` o `system`.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: ID único de la sesión (upload o playback)
      schema:
        type: string
        format: uuid

    AssetId:
      name: assetId
      in: path
      required: true
      description: ID único del VideoAsset
      schema:
        type: string
        format: uuid

    StreamId:
      name: streamId
      in: path
      required: true
      description: ID único del LiveStream
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Solicitud inválida o parámetros incorrectos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El actor no tiene permiso para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # ── Errores ────────────────────────────────────────────────────────────────

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: El recurso solicitado no existe.

    # ── Upload ─────────────────────────────────────────────────────────────────

    UploadSession:
      type: object
      required: [id, creatorId, status, totalBytes, uploadedBytes, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        creatorId:
          type: string
          format: uuid
        status:
          type: string
          enum: [initiated, uploading, completed, cancelled, failed]
        totalBytes:
          type: integer
          format: int64
          description: Tamaño total del archivo declarado al crear la sesión
        uploadedBytes:
          type: integer
          format: int64
          description: Bytes recibidos hasta el momento
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUploadSessionRequest:
      type: object
      required: [totalBytes, originalFormat]
      properties:
        totalBytes:
          type: integer
          format: int64
          description: Tamaño total del archivo en bytes
        originalFormat:
          type: string
          example: mp4
          description: Formato del archivo original (mp4, mov, mkv, etc.)

    UpdateUploadProgressRequest:
      type: object
      required: [uploadedBytes]
      properties:
        uploadedBytes:
          type: integer
          format: int64

    # ── Video asset ────────────────────────────────────────────────────────────

    VideoAsset:
      type: object
      required: [id, uploadSessionId, creatorId, durationSeconds, originalFormat, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        uploadSessionId:
          type: string
          format: uuid
        creatorId:
          type: string
          format: uuid
        durationSeconds:
          type: integer
          description: Duración del video en segundos
        originalFormat:
          type: string
          example: mp4
        status:
          type: string
          enum: [pending, processing, ready, failed]
          description: >
            pending — asset creado, procesamiento no iniciado;
            processing — transcoding en curso;
            ready — listo para reproducción y publicación editorial;
            failed — procesamiento fallido
        createdAt:
          type: string
          format: date-time

    VideoRendition:
      type: object
      required: [id, videoAssetId, quality, codec, bitrateKbps, url, fileSizeBytes]
      properties:
        id:
          type: string
          format: uuid
        videoAssetId:
          type: string
          format: uuid
        quality:
          type: string
          enum: [360p, 480p, 720p, 1080p, 4k]
        codec:
          type: string
          example: h264
        bitrateKbps:
          type: integer
          description: Bitrate de la rendition en kbps
        url:
          type: string
          format: uri
          description: URL de reproducción del archivo transcodificado
        fileSizeBytes:
          type: integer
          format: int64

    # ── Processing ─────────────────────────────────────────────────────────────

    ProcessingJob:
      type: object
      required: [id, videoAssetId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        videoAssetId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Playback ───────────────────────────────────────────────────────────────

    PlaybackSession:
      type: object
      required: [id, videoAssetId, deviceType, startedAt]
      properties:
        id:
          type: string
          format: uuid
        videoAssetId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
          description: Nulo si el espectador no está autenticado
        deviceType:
          type: string
          enum: [web, mobile, tv, desktop]
        region:
          type: string
          example: CL
          description: Código de país ISO 3166-1 alpha-2
        qualityUsed:
          type: string
          enum: [360p, 480p, 720p, 1080p, 4k]
          nullable: true
        watchedSeconds:
          type: integer
          default: 0
        interruptionCount:
          type: integer
          default: 0
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    CreatePlaybackSessionRequest:
      type: object
      required: [deviceType]
      properties:
        deviceType:
          type: string
          enum: [web, mobile, tv, desktop]
        region:
          type: string
          example: CL
        preferredQuality:
          type: string
          enum: [360p, 480p, 720p, 1080p, 4k]
          description: Calidad preferida; el sistema puede ajustarla según disponibilidad

    UpdatePlaybackProgressRequest:
      type: object
      required: [watchedSeconds]
      properties:
        watchedSeconds:
          type: integer
          description: Total de segundos vistos desde el inicio de la sesión
        qualityUsed:
          type: string
          enum: [360p, 480p, 720p, 1080p, 4k]
        interruptionCount:
          type: integer
          description: Interrupciones acumuladas (buffering, errores de red)

    # ── Live stream ────────────────────────────────────────────────────────────

    LiveStream:
      type: object
      required: [id, creatorId, status, streamKey, ingestUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        creatorId:
          type: string
          format: uuid
        status:
          type: string
          enum: [configured, live, paused, ended]
        streamKey:
          type: string
          description: Clave secreta para autenticar la conexión desde software externo
        ingestUrl:
          type: string
          format: uri
          description: URL de ingesta RTMP a la que apunta el software de streaming
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        recordingAssetId:
          type: string
          format: uuid
          nullable: true
          description: ID del VideoAsset generado si se solicitó grabación al finalizar
        createdAt:
          type: string
          format: date-time

    CreateLiveStreamRequest:
      type: object
      required: []
      properties:
        scheduledStartAt:
          type: string
          format: date-time
          nullable: true
          description: Hora programada de inicio (opcional, informativa)

    EndLiveStreamRequest:
      type: object
      properties:
        generateRecording:
          type: boolean
          default: false
          description: >
            Si true, el sistema genera un VideoAsset con la grabación completa
            del stream y lo procesa como video on-demand.
