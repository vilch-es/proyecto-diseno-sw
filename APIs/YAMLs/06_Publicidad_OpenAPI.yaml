openapi: 3.1.0
info:
  title: Publicidad y marketplace de anunciantes
  version: 1.0.0
  description: |-
    Gestiona el negocio publicitario B2B: anunciantes, campañas, creativos, targeting, inventario, entrega de anuncios, medición e ingresos para la plataforma.

    Este contexto entiende el video como **slot publicitario** (oportunidad de inventario) y al canal como **propiedad de inventario**. Su cliente principal es el **anunciante**, no el creador: cobra al anunciante y, cuando una impresión pagada se confirma, informa a Monetización para que reparta ingresos al creador.

    ## Actores
    - **advertiser** — anunciante que crea campañas, sube creativos y consulta métricas.
    - **system** — servicio interno que decide anuncios, mide y consume/emite eventos entre contextos.

    ## Eventos que consume
    - `content.published` (de Catálogo) — un contenido pasa a ser inventario potencialmente elegible.
    - `restriction.applied` (de Catálogo) — un contenido se restringe y deja de ser elegible para anuncios.
    - `engagement.signal` (de Audiencia) — señales de engagement/categoría usadas para brand safety.

    ## Eventos que emite
    - `ad.served` — un anuncio fue decidido y servido en una oportunidad de visualización.
    - `ad.impression.confirmed` — una impresión facturable fue confirmada.
    - `ad.revenue.generated` — ingreso publicitario generado, consumido por Monetización para atribuir al creador.
    - `campaign.budget.exhausted` — el presupuesto de una campaña se agotó.
servers:
- url: /api/v1/publicidad
  description: Servidor de producción
security:
- BearerAuth: []
tags:
- name: advertisers
  description: Gestión de cuentas de anunciantes y facturación 
- name: campaigns
  description: Campañas con objetivo, presupuesto, vigencia y ciclo de vida 
- name: creatives
  description: Creativos publicitarios y su validación 
- name: targeting
  description: Criterios de segmentación y estimación de inventario 
- name: delivery
  description: Decisión y entrega de anuncios 
- name: measurement
  description: Impresiones, clicks, skips y gasto
- name: reporting
  description: Métricas, reportes e invoices para anunciantes
- name: integration
  description: Endpoints internos para integración entre bounded contexts
paths:
  /advertisers:
    post:
      tags:
      - advertisers
      summary: Registrar una cuenta de anunciante
      description: 'Registra una cuenta de anunciante.'
      operationId: createAdvertiser
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvertiserCreateRequest'
      responses:
        '201':
          description: Anunciante creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advertiser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /advertisers/{advertiserId}:
    get:
      tags:
      - advertisers
      summary: Consultar un anunciante
      operationId: getAdvertiser
      parameters:
      - $ref: '#/components/parameters/AdvertiserIdParam'
      responses:
        '200':
          description: Datos del anunciante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advertiser'
        '404':
          $ref: '#/components/responses/NotFound'
  /advertisers/{advertiserId}/billing:
    put:
      tags:
      - advertisers
      summary: Administrar datos de facturación
      description: 'Administra los datos de facturación del anunciante.'
      operationId: updateBillingProfile
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      parameters:
      - $ref: '#/components/parameters/AdvertiserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingProfile'
      responses:
        '200':
          description: Datos de facturación actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns:
    post:
      tags:
      - campaigns
      summary: Crear una campaña
      description: 'Crea una campaña con objetivo, presupuesto y vigencia.'
      operationId: createCampaign
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
      responses:
        '201':
          description: Campaña creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - campaigns
      summary: Listar campañas de un anunciante
      operationId: listCampaigns
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      parameters:
      - name: advertiserId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Listado paginado de campañas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPage'
  /campaigns/{campaignId}:
    get:
      tags:
      - campaigns
      summary: Consultar una campaña
      operationId: getCampaign
      parameters:
      - $ref: '#/components/parameters/CampaignIdParam'
      responses:
        '200':
          description: Detalle de la campaña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns/{campaignId}/status:
    put:
      tags:
      - campaigns
      summary: Cambiar estado de una campaña
      description: 'Pausa, reanuda o finaliza una campaña. No se sirven anuncios si el presupuesto está agotado.'
      operationId: setCampaignStatus
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      parameters:
      - $ref: '#/components/parameters/CampaignIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignStatusRequest'
      responses:
        '200':
          description: Estado de la campaña actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /creatives:
    post:
      tags:
      - creatives
      summary: Subir y registrar un creativo
      description: 'Sube y registra un creativo (video, display, etc.). Queda en validación según políticas publicitarias.'
      operationId: createCreative
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreativeCreateRequest'
      responses:
        '201':
          description: Creativo registrado, pendiente de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creative'
        '400':
          $ref: '#/components/responses/BadRequest'
  /creatives/{creativeId}:
    get:
      tags:
      - creatives
      summary: Consultar un creativo y su estado de validación
      operationId: getCreative
      parameters:
      - $ref: '#/components/parameters/CreativeIdParam'
      responses:
        '200':
          description: Detalle del creativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creative'
        '404':
          $ref: '#/components/responses/NotFound'
  /creatives/{creativeId}/review:
    put:
      tags:
      - creatives
      summary: Aprobar o rechazar un creativo
      description: ' Revisa un creativo pendiente según políticas publicitarias y lo aprueba o rechaza.'
      operationId: reviewCreative
      security:
      - BearerAuth: []
      x-actor: [system]
      parameters:
      - $ref: '#/components/parameters/CreativeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreativeReviewRequest'
      responses:
        '200':
          description: Creativo revisado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creative'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns/{campaignId}/creatives:
    post:
      tags:
      - creatives
      summary: Asociar un creativo a una campaña
      description: 'Asocia un creativo existente a una campaña.'
      operationId: attachCreativeToCampaign
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      parameters:
      - $ref: '#/components/parameters/CampaignIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - creativeId
              properties:
                creativeId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Creativo asociado a la campaña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El creativo no está aprobado o ya está asociado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /campaigns/{campaignId}/targeting:
    put:
      tags:
      - targeting
      summary: Definir criterios de segmentación
      description: 'Define criterios de segmentación (país, edad, intereses, categoría de contenido, etc.).'
      operationId: setTargeting
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      parameters:
      - $ref: '#/components/parameters/CampaignIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Targeting'
      responses:
        '200':
          description: Segmentación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Targeting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /inventory/estimate:
    post:
      tags:
      - targeting
      summary: Estimar inventario disponible según targeting
      description: 'Estima el inventario disponible para un conjunto de criterios de segmentación.'
      operationId: estimateInventory
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Targeting'
      responses:
        '200':
          description: Estimación de inventario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryEstimate'
        '400':
          $ref: '#/components/responses/BadRequest'
  /inventory/eligibility:
    get:
      tags:
      - targeting
      summary: Consultar elegibilidad publicitaria de un contenido
      description: |-
        Determina si un contenido es elegible para mostrar anuncios, respetando las restricciones del catálogo
        (no monetizable, restringido, etc.). Consulta síncrona usada por la decisión de anuncios.
      operationId: getContentAdEligibility
      parameters:
      - name: catalogItemId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Elegibilidad publicitaria del contenido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdEligibility'
        '404':
          $ref: '#/components/responses/NotFound'
  /ad-requests:
    post:
      tags:
      - delivery
      summary: Decidir qué anuncio mostrar en una oportunidad de visualización
      description: |-
        Ante una oportunidad de visualización, decide qué anuncio mostrar (o ninguno), considerando campañas activas,
        targeting, subasta/prioridad y brand safety. Si se sirve un anuncio, emite `ad.served`.
      operationId: decideAd
      security:
      - BearerAuth: []
      x-actor: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdRequest'
      responses:
        '200':
          description: Decisión de anuncio (puede no incluir anuncio).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
  /impressions:
    post:
      tags:
      - measurement
      summary: Registrar una impresión servida
      description: |-
        Registra una impresión servida. Al confirmarse como facturable, emite `ad.impression.confirmed` y
        `ad.revenue.generated` (este último consumido por Monetización).
      operationId: recordImpression
      security:
      - BearerAuth: []
      x-actor: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpressionRequest'
      responses:
        '201':
          description: Impresión registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impression'
        '400':
          $ref: '#/components/responses/BadRequest'
  /impressions/{impressionId}/events:
    post:
      tags:
      - measurement
      summary: Registrar click o skip sobre una impresión
      description: 'Registra un click o un skip asociado a una impresión previamente servida.'
      operationId: recordImpressionInteraction
      security:
      - BearerAuth: []
      x-actor: [system]
      parameters:
      - $ref: '#/components/parameters/ImpressionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  enum:
                  - click
                  - skip
                occurredAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Interacción registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impression'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns/{campaignId}/metrics:
    get:
      tags:
      - reporting
      summary: Consultar métricas de una campaña
      description: 'Expone métricas de campaña: impresiones, CTR, CPM, gasto.'
      operationId: getCampaignMetrics
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      parameters:
      - $ref: '#/components/parameters/CampaignIdParam'
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Métricas de la campaña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignMetrics'
        '404':
          $ref: '#/components/responses/NotFound'
  /advertisers/{advertiserId}/invoices:
    get:
      tags:
      - reporting
      summary: Listar invoices de un anunciante
      description: 'Genera reportes e invoices para el anunciante.'
      operationId: listInvoices
      security:
      - BearerAuth: []
      x-actor: [advertiser]
      parameters:
      - $ref: '#/components/parameters/AdvertiserIdParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Listado paginado de invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/content-published:
    post:
      tags:
      - integration
      summary: Consumir evento de contenido publicado
      description: Consume `content.published` (de Catálogo) para incorporar el contenido como inventario potencialmente elegible.
      operationId: consumeContentPublishedEvent
      security:
      - BearerAuth: []
      x-actor: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentPublishedEvent'
      responses:
        '202':
          description: Evento aceptado.
        '400':
          $ref: '#/components/responses/BadRequest'
  /events/restriction-applied:
    post:
      tags:
      - integration
      summary: Consumir evento de restricción aplicada
      description: Consume `restriction.applied` (de Catálogo); marca el contenido como no elegible para anuncios si corresponde.
      operationId: consumeRestrictionAppliedEvent
      security:
      - BearerAuth: []
      x-actor: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictionAppliedEvent'
      responses:
        '202':
          description: Evento aceptado.
        '400':
          $ref: '#/components/responses/BadRequest'
  /events/engagement-signal:
    post:
      tags:
      - integration
      summary: Consumir señal de engagement para brand safety
      description: Consume `engagement.signal` (de Audiencia) para enriquecer las decisiones de brand safety.
      operationId: consumeEngagementSignalEvent
      security:
      - BearerAuth: []
      x-actor: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementSignalEvent'
      responses:
        '202':
          description: Evento aceptado.
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT con rol de actor: advertiser o system.'
  parameters:
    AdvertiserIdParam:
      name: advertiserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignIdParam:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CreativeIdParam:
      name: creativeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImpressionIdParam:
      name: impressionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Solicitud inválida o parámetros incorrectos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El actor no tiene permiso para ejecutar esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: El recurso solicitado no existe.
        details:
          type: [object, "null"]
          additionalProperties: true
          description: Información adicional sobre el error (contexto específico de depuración)
    Advertiser:
      type: object
      description: Cuenta de negocio B2B. El usuario aquí es un anunciante, no un viewer ni un creador.
      required:
      - advertiserId
      - name
      - status
      - createdAt
      properties:
        advertiserId:
          type: string
          format: uuid
        name:
          type: string
        contactEmail:
          type: string
          format: email
        status:
          type: string
          enum:
          - active
          - suspended
        billing:
          $ref: '#/components/schemas/BillingProfile'
        createdAt:
          type: string
          format: date-time
    AdvertiserCreateRequest:
      type: object
      required:
      - name
      - contactEmail
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        contactEmail:
          type: string
          format: email
    BillingProfile:
      type: object
      required:
      - legalName
      - country
      properties:
        legalName:
          type: string
        taxId:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
        address:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
    Campaign:
      type: object
      description: Acuerdo de inversión publicitaria con objetivo, presupuesto y vigencia.
      required:
      - campaignId
      - advertiserId
      - name
      - objective
      - budget
      - currency
      - status
      properties:
        campaignId:
          type: string
          format: uuid
        advertiserId:
          type: string
          format: uuid
        name:
          type: string
        objective:
          type: string
          enum:
          - awareness
          - traffic
          - conversions
        budget:
          type: number
          minimum: 0
        spend:
          type: number
          minimum: 0
          description: Gasto acumulado en base a impresiones/clicks.
        currency:
          type: string
          minLength: 3
          maxLength: 3
        startDate:
          type: string
          format: date
        endDate:
          type: [string, "null"]
          format: date
          description: Fecha de finalización opcional. Null si la campaña es indefinida o finaliza por presupuesto.
        status:
          type: string
          enum:
          - draft
          - active
          - paused
          - ended
          - budget_exhausted
        creativeIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
    CampaignCreateRequest:
      type: object
      required:
      - advertiserId
      - name
      - objective
      - budget
      - currency
      - startDate
      properties:
        advertiserId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        objective:
          type: string
          enum:
          - awareness
          - traffic
          - conversions
        budget:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    CampaignStatusRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - pause
          - resume
          - end
    CampaignPage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    Creative:
      type: object
      description: Pieza publicitaria (video, display, etc.) sujeta a validación por políticas.
      required:
      - creativeId
      - advertiserId
      - format
      - status
      properties:
        creativeId:
          type: string
          format: uuid
        advertiserId:
          type: string
          format: uuid
        format:
          type: string
          enum:
          - video
          - display
        mediaUrl:
          type: string
          format: uri
        landingUrl:
          type: string
          format: uri
        durationSeconds:
          type: [integer, "null"]
          minimum: 0
          description: Duración en segundos. Null si format=display (solo aplica a creativos de video).
        status:
          type: string
          enum:
          - pending_review
          - approved
          - rejected
        reviewReason:
          type: [string, "null"]
          description: Motivo del rechazo si status=rejected. Null en otros estados.
        createdAt:
          type: string
          format: date-time
    CreativeCreateRequest:
      type: object
      required:
      - advertiserId
      - format
      - mediaUrl
      properties:
        advertiserId:
          type: string
          format: uuid
        format:
          type: string
          enum:
          - video
          - display
        mediaUrl:
          type: string
          format: uri
        landingUrl:
          type: string
          format: uri
        durationSeconds:
          type: integer
          minimum: 0
    CreativeReviewRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        reason:
          type: [string, "null"]
          description: Motivo del rechazo. Se persiste en reviewReason cuando decision=rejected.
    Targeting:
      type: object
      description: Criterios de segmentación de una campaña.
      properties:
        countries:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 2
        ageRanges:
          type: array
          items:
            type: string
            enum:
            - 13-17
            - 18-24
            - 25-34
            - 35-44
            - 45-54
            - 55+
        interests:
          type: array
          items:
            type: string
        contentCategories:
          type: array
          items:
            type: string
        adFormats:
          type: array
          items:
            type: string
            enum:
            - pre-roll
            - mid-roll
            - display
    InventoryEstimate:
      type: object
      required:
      - estimatedImpressions
      properties:
        estimatedImpressions:
          type: integer
          minimum: 0
        estimatedReach:
          type: integer
          minimum: 0
        estimatedCpm:
          type: number
          minimum: 0
    AdEligibility:
      type: object
      description: Resultado de elegibilidad publicitaria de un contenido, derivado de las restricciones de Catálogo.
      required:
      - catalogItemId
      - eligible
      properties:
        catalogItemId:
          type: string
          format: uuid
        eligible:
          type: boolean
        reasons:
          type: array
          items:
            type: string
          example:
          - monetizable
          - not-restricted
    AdRequest:
      type: object
      description: Oportunidad de visualización sobre la que se decide qué anuncio mostrar. El video es un slot publicitario.
      required:
      - catalogItemId
      - slot
      properties:
        catalogItemId:
          type: string
          format: uuid
        videoAssetId:
          type: [string, "null"]
          format: uuid
          description: Asset técnico del video. Null si no se conoce o no aplica.
        channelId:
          type: [string, "null"]
          format: uuid
          description: Canal propietario del contenido. Null si no se conoce.
        viewerId:
          type: [string, "null"]
          format: uuid
          description: ID del espectador. Null si es anónimo.
        slot:
          type: string
          enum:
          - pre-roll
          - mid-roll
          - display
        country:
          type: string
          minLength: 2
          maxLength: 2
        age:
          type: [integer, "null"]
          minimum: 0
          description: Edad estimada del espectador. Null si se desconoce.
        contentCategory:
          type: [string, "null"]
          description: Categoría del contenido para decisiones de brand safety. Null si se desconoce.
    AdDecision:
      type: object
      description: Resultado de la decisión de anuncio. Si no hay anuncio elegible, adServed es false.
      required:
      - adServed
      properties:
        adServed:
          type: boolean
          description: true si se sirvió un anuncio, false si no hay inventario/cumple restricciones.
        impressionId:
          type: [string, "null"]
          format: uuid
          description: ID de la oportunidad si adServed=true. Null si adServed=false. Se usa al registrar la impresión.
        campaignId:
          type: [string, "null"]
          format: uuid
          description: Campaña seleccionada si adServed=true. Null si adServed=false.
        creativeId:
          type: [string, "null"]
          format: uuid
          description: Creativo seleccionado si adServed=true. Null si adServed=false.
        reason:
          type: [string, "null"]
          description: Motivo cuando adServed=false (ej. sin inventario, brand safety, presupuesto agotado).
    ImpressionRequest:
      type: object
      required:
      - impressionId
      - campaignId
      - creativeId
      - catalogItemId
      properties:
        impressionId:
          type: string
          format: uuid
          description: Mismo identificador devuelto por la decisión de anuncio.
        campaignId:
          type: string
          format: uuid
        creativeId:
          type: string
          format: uuid
        catalogItemId:
          type: string
          format: uuid
        videoAssetId:
          type: [string, "null"]
          format: uuid
          description: Asset técnico del video. Información opcional para auditoría y debugging.
        channelId:
          type: [string, "null"]
          format: uuid
          description: Canal propietario. Información opcional para auditoría y debugging.
        viewerId:
          type: [string, "null"]
          format: uuid
          description: ID del espectador. Información opcional para auditoría y debugging.
        servedAt:
          type: string
          format: date-time
    Impression:
      type: object
      required:
      - impressionId
      - campaignId
      - creativeId
      - status
      - billable
      properties:
        impressionId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        creativeId:
          type: string
          format: uuid
        catalogItemId:
          type: string
          format: uuid
        channelId:
          type: [string, "null"]
          format: uuid
          description: Canal propietario. Puede ser null si se pierde la referencia durante la auditoría.
        status:
          type: string
          enum:
          - served
          - clicked
          - skipped
        billable:
          type: boolean
          description: Indica si la impresión es facturable y generó ingreso.
        cost:
          type: number
          minimum: 0
          description: Costo cobrado al anunciante por esta impresión.
        currency:
          type: string
          minLength: 3
          maxLength: 3
        servedAt:
          type: string
          format: date-time
    CampaignMetrics:
      type: object
      required:
      - campaignId
      - impressions
      - clicks
      - spend
      properties:
        campaignId:
          type: string
          format: uuid
        impressions:
          type: integer
          minimum: 0
        clicks:
          type: integer
          minimum: 0
        skips:
          type: integer
          minimum: 0
        ctr:
          type: number
          description: Click-through rate (clicks / impresiones).
        cpm:
          type: number
          description: Costo por mil impresiones.
        spend:
          type: number
          description: Gasto acumulado de la campaña.
        currency:
          type: string
    Invoice:
      type: object
      required:
      - invoiceId
      - advertiserId
      - amount
      - currency
      - status
      - periodStart
      - periodEnd
      properties:
        invoiceId:
          type: string
          format: uuid
        advertiserId:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum:
          - issued
          - paid
          - overdue
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        issuedAt:
          type: string
          format: date-time
    InvoicePage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    # Copias locales de eventos emitidos por Catálogo para evitar refs externos.
    ContentPublishedEvent:
      type: object
      description: Estructura canónica del evento `content.published` emitido por Catálogo.
      required:
      - eventId
      - catalogItemId
      - channelId
      - publishedAt
      properties:
        eventId:
          type: string
          format: uuid
        catalogItemId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        videoAssetId:
          type: [string, "null"]
          format: uuid
          description: Asset técnico asociado (nullable si no aplica).
        publishedAt:
          type: string
          format: date-time

    # Shape canónica del evento `restriction.applied` emitido por Catálogo.
    RestrictionAppliedEvent:
      type: object
      description: Estructura canónica del evento `restriction.applied` emitido por Catálogo.
      required:
      - eventId
      - catalogItemId
      - type
      - active
      - appliedAt
      properties:
        eventId:
          type: string
          format: uuid
        catalogItemId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - age
          - geo
          - monetization
          - moderation
        active:
          type: boolean
        reason:
          type: [string, "null"]
        appliedAt:
          type: string
          format: date-time

    # Shape local del evento `engagement.signal` consumido desde Audiencia.
    # Definición propia de este contexto (no $ref externo) para mantener el spec independiente.
    EngagementSignalEvent:
      type: object
      description: Estructura esperada del evento `engagement.signal`, interpretada desde la perspectiva de Publicidad para brand safety.
      required:
      - eventId
      - catalogItemId
      - signalType
      - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        catalogItemId:
          type: string
          format: uuid
        channelId:
          type: [string, "null"]
          format: uuid
        signalType:
          type: string
          enum:
          - reaction
          - comment
          - view_time
        contentCategory:
          type: [string, "null"]
        aggregatedScore:
          type: [number, "null"]
        occurredAt:
          type: string
          format: date-time
    AdRevenueGeneratedEvent:
      type: object
      description: |-
        Estructura canónica del evento `ad.revenue.generated` que este contexto EMITE hacia Monetización
        cuando una impresión facturable se confirma.

        Fuente de verdad: Monetización referencia este esquema vía `$ref` externo en lugar de
        duplicar su definición.
      required:
      - eventId
      - impressionId
      - catalogItemId
      - channelId
      - amount
      - currency
      - generatedAt
      properties:
        eventId:
          type: string
          format: uuid
        impressionId:
          type: string
          format: uuid
          description: Se usa como referenceId para idempotencia del ingreso en Monetización.
        campaignId:
          type: string
          format: uuid
        catalogItemId:
          type: string
          format: uuid
          description: Contenido sobre el que se sirvió el anuncio (referencia a Catálogo).
        videoAssetId:
          type: [string, "null"]
          format: uuid
          description: Asset técnico asociado. Null si no se conoce o no aplica.
        channelId:
          type: string
          format: uuid
          description: Canal propietario del contenido, destinatario del ingreso.
        amount:
          type: number
          description: Monto bruto del ingreso publicitario a repartir.
        currency:
          type: string
          minLength: 3
          maxLength: 3
        generatedAt:
          type: string
          format: date-time
