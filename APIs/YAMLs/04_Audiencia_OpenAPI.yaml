# OpenAPI del bounded context generado a partir de los requisitos del proyecto y la estructura JSON existente.
openapi: 3.1.0
info:
  title: Audiencia, comunidad y engagement
  version: 1.0.0
  description: |-
    Gestiona la relación social entre usuarios, creadores y contenido: suscripciones, reacciones, comentarios, notificaciones, historial, listas personales y comunidad del canal.

    Este contexto entiende la suscripción como **relación social**, no como pago Premium. No define metadata editorial, no decide ranking del home y no procesa pagos. Cuando usa `catalogItemId` o `channelId`, los trata como referencias externas validadas contra Catálogo.

    ## Actores
    - **viewer** — usuario que sigue canales, reacciona, comenta y gestiona historial.
    - **creator** — creador que puede fijar comentarios o publicar en comunidad.
    - **system** — servicio interno que notifica nuevo contenido o cambios de visibilidad.

    ## Eventos que consume
    - `content.published` — nuevo contenido publicado para notificar suscriptores.
    - `content.unpublished` / `restriction.applied` — cambios de visibilidad para ocultar interacciones si aplica.

    ## Eventos que emite
    - `user.subscribed` / `user.unsubscribed`.
    - `reaction.recorded`.
    - `comment.created` / `comment.deleted`.
    - `engagement.signal` — señal agregada consumida por Descubrimiento.

    Antes de crear reacciones, comentarios, historial o elementos de "ver después", Audiencia valida el `catalogItemId` con Catálogo usando la consulta síncrona de visibilidad. Para suscripciones y posts de comunidad valida la existencia de `channelId` contra Catálogo, sin copiar metadata editorial.

    La integración con Catálogo es eventualmente consistente. Si Catálogo informa que un contenido deja de estar visible, Audiencia oculta interacciones públicas, evita nuevas interacciones y mantiene datos privados como historial o listas personales salvo borrado del usuario.
servers:
- url: /api/v1/audiencia
  description: Servidor de producción
security:
- BearerAuth: []
tags:
- name: subscriptions
  description: Suscripciones sociales a canales (RF-A1)
- name: reactions
  description: Likes, dislikes y totales agregados (RF-A2)
- name: comments
  description: Comentarios, respuestas, fijado y reportes (RF-A3)
- name: notifications
  description: Notificaciones y preferencias (RF-A4)
- name: history
  description: Historial y listas personales (RF-A5)
- name: community
  description: Posts de comunidad del canal (RF-A6)
- name: integration
  description: Eventos internos consumidos/emitidos por el contexto
paths:
  /subscriptions:
    post:
      tags:
      - subscriptions
      summary: Seguir un canal
      description: 'RF-A1: Crea una relación social usuario-canal. Valida la existencia de `channelId` contra Catálogo sin copiar metadata editorial.'
      operationId: subscribeToChannel
      security:
      - BearerAuth:
        - viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequest'
      responses:
        '201':
          description: Suscripción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
      - subscriptions
      summary: Listar canales seguidos por un usuario
      operationId: listSubscriptions
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/UserIdQueryParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Suscripciones del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
  /subscriptions/{subscriptionId}:
    delete:
      tags:
      - subscriptions
      summary: Dejar de seguir un canal
      operationId: unsubscribeFromChannel
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParam'
      responses:
        '204':
          description: Suscripción eliminada.
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channelId}/subscribers/count:
    get:
      tags:
      - subscriptions
      summary: Consultar conteo de suscriptores
      operationId: getSubscriberCount
      parameters:
      - $ref: '#/components/parameters/ChannelIdParam'
      responses:
        '200':
          description: Conteo agregado de suscriptores.
          content:
            application/json:
              schema:
                type: object
                required:
                - channelId
                - count
                properties:
                  channelId:
                    type: string
                    format: uuid
                  count:
                    type: integer
                    minimum: 0
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reactions:
    post:
      tags:
      - reactions
      summary: Registrar reacción a contenido
      description: 'RF-A2: Registra like o dislike. Antes de crearla valida el `catalogItemId` con la consulta síncrona de visibilidad de Catálogo. Si ya existe reacción, puede retornar conflicto o reemplazo según regla de negocio.'
      operationId: createReaction
      security:
      - BearerAuth:
        - viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '201':
          description: Reacción registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reactions/{reactionId}:
    patch:
      tags:
      - reactions
      summary: Cambiar una reacción previa
      operationId: updateReaction
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/ReactionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionUpdateRequest'
      responses:
        '200':
          description: Reacción actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - reactions
      summary: Eliminar una reacción previa
      operationId: deleteReaction
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/ReactionIdParam'
      responses:
        '204':
          description: Reacción eliminada.
        '404':
          $ref: '#/components/responses/NotFound'
  /content/{catalogItemId}/reactions/totals:
    get:
      tags:
      - reactions
      summary: Consultar totales agregados de reacciones
      operationId: getReactionTotals
      parameters:
      - $ref: '#/components/parameters/CatalogItemIdParam'
      responses:
        '200':
          description: Totales agregados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionTotals'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /comments:
    post:
      tags:
      - comments
      summary: Publicar comentario o respuesta
      description: 'RF-A3: Permite comentar contenido o responder a un comentario existente. Antes de crear el comentario valida el `catalogItemId` con la consulta síncrona de visibilidad de Catálogo.'
      operationId: createComment
      security:
      - BearerAuth:
        - viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: Comentario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /content/{catalogItemId}/comments:
    get:
      tags:
      - comments
      summary: Listar comentarios de un contenido
      operationId: listComments
      parameters:
      - $ref: '#/components/parameters/CatalogItemIdParam'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - recent
          - top
          default: top
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Comentarios paginados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /comments/{commentId}:
    patch:
      tags:
      - comments
      summary: Editar comentario propio
      operationId: updateComment
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/CommentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdateRequest'
      responses:
        '200':
          description: Comentario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - comments
      summary: Eliminar comentario propio
      operationId: deleteComment
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/CommentIdParam'
      responses:
        '204':
          description: Comentario eliminado.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /comments/{commentId}/pin:
    post:
      tags:
      - comments
      summary: Fijar comentario destacado
      operationId: pinComment
      security:
      - BearerAuth:
        - creator
      parameters:
      - $ref: '#/components/parameters/CommentIdParam'
      responses:
        '200':
          description: Comentario fijado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /comments/{commentId}/report:
    post:
      tags:
      - comments
      summary: Reportar comentario inapropiado
      operationId: reportComment
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/CommentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentReportRequest'
      responses:
        '202':
          description: Reporte aceptado.
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications:
    get:
      tags:
      - notifications
      summary: Listar notificaciones del usuario
      operationId: listNotifications
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/UserIdQueryParam'
      - name: unreadOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Notificaciones paginadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
  /notifications/{notificationId}/read:
    post:
      tags:
      - notifications
      summary: Marcar notificación como leída
      operationId: markNotificationAsRead
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/NotificationIdParam'
      responses:
        '204':
          description: Notificación marcada como leída.
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/preferences:
    get:
      tags:
      - notifications
      summary: Obtener preferencias de notificación
      operationId: getNotificationPreferences
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/UserIdQueryParam'
      responses:
        '200':
          description: Preferencias actuales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
    put:
      tags:
      - notifications
      summary: Actualizar preferencias de notificación
      operationId: updateNotificationPreferences
      security:
      - BearerAuth:
        - viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Preferencias actualizadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/{userId}/history:
    get:
      tags:
      - history
      summary: Consultar historial de visualización
      operationId: getWatchHistory
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/UserIdParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Historial paginado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
    post:
      tags:
      - history
      summary: Registrar visualización en historial
      description: Registra una referencia privada de historial. Antes de crearla valida el `catalogItemId` con la consulta síncrona de visibilidad de Catálogo.
      operationId: recordWatchHistory
      security:
      - BearerAuth:
        - viewer
        - system
      parameters:
      - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryCreateRequest'
      responses:
        '201':
          description: Entrada de historial creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - history
      summary: Borrar historial del usuario
      operationId: clearWatchHistory
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: Historial borrado.
  /users/{userId}/watch-later:
    get:
      tags:
      - history
      summary: Listar contenidos guardados para ver después
      operationId: listWatchLater
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/UserIdParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Lista Ver después.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchLaterPage'
    post:
      tags:
      - history
      summary: Guardar contenido para ver después
      description: Antes de guardar valida el `catalogItemId` con la consulta síncrona de visibilidad de Catálogo.
      operationId: addWatchLater
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchLaterRequest'
      responses:
        '201':
          description: Contenido guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchLaterItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{userId}/watch-later/{catalogItemId}:
    delete:
      tags:
      - history
      summary: Quitar contenido de Ver después
      operationId: removeWatchLater
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/UserIdParam'
      - $ref: '#/components/parameters/CatalogItemIdParam'
      responses:
        '204':
          description: Contenido quitado.
        '404':
          $ref: '#/components/responses/NotFound'
  /community-posts:
    post:
      tags:
      - community
      summary: Crear post de comunidad
      description: 'RF-A6: Permite al creador publicar texto, encuesta o imagen independiente de un video. Valida la existencia de `channelId` contra Catálogo sin copiar metadata editorial.'
      operationId: createCommunityPost
      security:
      - BearerAuth:
        - creator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityPostCreateRequest'
      responses:
        '201':
          description: Post de comunidad creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channelId}/community-posts:
    get:
      tags:
      - community
      summary: Listar posts de comunidad de un canal
      operationId: listCommunityPosts
      parameters:
      - $ref: '#/components/parameters/ChannelIdParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Posts paginados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPostPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /community-posts/{postId}/reactions:
    post:
      tags:
      - community
      summary: Reaccionar a post de comunidad
      operationId: reactToCommunityPost
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityPostReactionRequest'
      responses:
        '201':
          description: Reacción registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPostReaction'
        '404':
          $ref: '#/components/responses/NotFound'
  /community-posts/{postId}/comments:
    get:
      tags:
      - community
      summary: Listar comentarios de un post de comunidad
      operationId: listCommunityPostComments
      parameters:
      - $ref: '#/components/parameters/PostIdParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Comentarios paginados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - community
      summary: Comentar post de comunidad
      operationId: commentCommunityPost
      security:
      - BearerAuth:
        - viewer
      parameters:
      - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityPostCommentRequest'
      responses:
        '201':
          description: Comentario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/content-published:
    post:
      tags:
      - integration
      summary: Consumir evento de nuevo contenido publicado
      operationId: consumeContentPublishedEvent
      security:
      - BearerAuth:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentPublishedEvent'
      responses:
        '202':
          description: Evento aceptado; se generarán notificaciones eventualmente.
  /events/content-visibility-changed:
    post:
      tags:
      - integration
      summary: Consumir evento de cambio de visibilidad
      operationId: consumeContentVisibilityChangedEvent
      security:
      - BearerAuth:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentVisibilityChangedEvent'
      responses:
        '202':
          description: Evento aceptado; las interacciones se ocultarán o restaurarán eventualmente.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT con roles/scopes de actor. Los valores declarados en `security` para cada operación indican los roles/scopes permitidos, por ejemplo viewer, creator o system.'
  parameters:
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdQueryParam:
      name: userId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ChannelIdParam:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogItemIdParam:
      name: catalogItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionIdParam:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReactionIdParam:
      name: reactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentIdParam:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationIdParam:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostIdParam:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Solicitud inválida o parámetros incorrectos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El actor no tiene permiso para ejecutar esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: El recurso solicitado no existe.
        details:
          type: object
          additionalProperties: true
          nullable: true
    SubscriptionCreateRequest:
      type: object
      required:
      - userId
      - channelId
      properties:
        userId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
    Subscription:
      type: object
      required:
      - subscriptionId
      - userId
      - channelId
      - subscribedAt
      properties:
        subscriptionId:
          type: string
          format: uuid
        userId:
